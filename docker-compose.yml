# Local parity for the deployment in infra/terraform, on one machine.
#
#   cp .env.example .env                    # then set CADUCEUS_DEID_KEY and CADUCEUS_DB_PASSWORD
#   docker compose up --build               # review UI and API on http://127.0.0.1:8000
#
# With the in-network model the demo runs (infra/model), after setting CADUCEUS_IN_VPC_URL=http://model:8081/v1 in .env:
#   docker compose --profile llm up --build   # the first build compiles llama.cpp, which takes a while
#
# The model server sits on an internal network with no route to the internet, as the GPU instance sits in an
# isolated subnet in AWS. Only the API can reach it, and nothing publishes its port.
#
# Postgres holds the cases and the audit log, as RDS does in AWS (docs/postgres.md), on an internal network of its
# own: only the API reaches it, nothing publishes its port, and its data lives in the pgdata volume. The API applies
# the migrations and seeds the demo cases when it starts, if the database holds none yet.
#
# The database password is read from .env (CADUCEUS_DB_PASSWORD), never written here. Compose hands it to Postgres,
# and to the API inside CADUCEUS_DATABASE_URL, so make one that needs no escaping in a URL:
#   python -c "import secrets; print(secrets.token_urlsafe(32))"
# Postgres takes the password only when it first creates the volume. To change it later, change it in the database
# (ALTER ROLE caduceus PASSWORD ...) and then in .env; or start over with `docker compose down -v`, which deletes
# the volume and every case in it.
#
# Sign-in with OpenID Connect against a local Keycloak, as the health system's identity provider (docs/sign-in.md):
# set CADUCEUS_AUTH_MODE=oidc, CADUCEUS_KEYCLOAK_ADMIN_PASSWORD and CADUCEUS_KEYCLOAK_USER_PASSWORD in .env, then
#   docker compose --profile oidc up --build
# Keycloak imports infra/keycloak/mesaverde-realm.json when it starts. The browser reaches it on 127.0.0.1:8080, and
# the API reaches it on an internal network for its signing keys.

name: caduceus

services:
  api:
    build: .
    image: caduceus-api:local
    command: ["sh", "-c", "python -m caduceus.seed --if-missing && exec uvicorn caduceus.api:create_app --factory --host 0.0.0.0 --port 8000"]
    environment:
      CADUCEUS_AUTH_MODE: ${CADUCEUS_AUTH_MODE:-dev}
      CADUCEUS_DEID_KEY: ${CADUCEUS_DEID_KEY:?Set CADUCEUS_DEID_KEY in .env (at least 32 bytes)}
      CADUCEUS_DATABASE_URL: postgresql://caduceus:${CADUCEUS_DB_PASSWORD:?Set CADUCEUS_DB_PASSWORD in .env}@db:5432/caduceus
      CADUCEUS_CLINIC_TZ: ${CADUCEUS_CLINIC_TZ:-America/Denver}
      CADUCEUS_IN_VPC_URL: ${CADUCEUS_IN_VPC_URL:-}
      CADUCEUS_IN_VPC_MODEL: ${CADUCEUS_IN_VPC_MODEL:-qwen2.5-1.5b-instruct}
      CADUCEUS_IN_VPC_DRAFTS: ${CADUCEUS_IN_VPC_DRAFTS:-1}
      CADUCEUS_EXTERNAL_API_KEY: ${CADUCEUS_EXTERNAL_API_KEY:-}
      # Read only with CADUCEUS_AUTH_MODE=oidc. By default the local Keycloak below: the issuer is the address the
      # browser uses, which its tokens name; the signing keys come over the internal network.
      CADUCEUS_OIDC_ISSUER: ${CADUCEUS_OIDC_ISSUER:-http://localhost:8080/realms/mesaverde}
      CADUCEUS_OIDC_JWKS_URL: ${CADUCEUS_OIDC_JWKS_URL:-http://keycloak:8080/realms/mesaverde/protocol/openid-connect/certs}
      CADUCEUS_OIDC_AUDIENCE: ${CADUCEUS_OIDC_AUDIENCE:-caduceus-api}
      CADUCEUS_OIDC_CLIENT_ID: ${CADUCEUS_OIDC_CLIENT_ID:-caduceus-ui}
    ports:
      - "127.0.0.1:8000:8000"   # development sign-in is for this machine only
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [edge, model, data, auth]

  db:
    # TODO: pin by digest (postgres:17@sha256:...), as the Dockerfile's base images are; the registry could not be
    # reached when this was written. CI's Postgres job uses the same image.
    image: postgres:17
    environment:
      POSTGRES_USER: caduceus
      POSTGRES_DB: caduceus
      POSTGRES_PASSWORD: ${CADUCEUS_DB_PASSWORD:?Set CADUCEUS_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]            # internal only: no egress, no published port
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # Over TCP, as the API connects: while Postgres first creates the volume it listens only on its local socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U caduceus -d caduceus"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  keycloak:
    # The identity provider for OIDC sign-in on this machine: the mesaverde realm, its caduceus-ui client and the six
    # people of the development roster. Passwords come from .env into the realm file's placeholders; none is written
    # down here or there. Its database lives in the container, so `docker compose down` starts it over from the file.
    # TODO: pin by digest (quay.io/keycloak/keycloak:26.8.1@sha256:...), as the Dockerfile's base images are; the
    # registry could not be reached when this was written.
    profiles: [oidc]
    image: quay.io/keycloak/keycloak:26.8.1
    entrypoint: ["/bin/bash", "-c"]
    # Refuses to start without both passwords, rather than make accounts with empty ones.
    command:
      - |
        unset_() { echo "Set $$1 in .env, 12 characters or more (docs/sign-in.md)." >&2; exit 1; }
        [ "$${#KC_BOOTSTRAP_ADMIN_PASSWORD}" -ge 12 ] || unset_ CADUCEUS_KEYCLOAK_ADMIN_PASSWORD
        [ "$${#CADUCEUS_KEYCLOAK_USER_PASSWORD}" -ge 12 ] || unset_ CADUCEUS_KEYCLOAK_USER_PASSWORD
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${CADUCEUS_KEYCLOAK_ADMIN_PASSWORD:-}
      CADUCEUS_KEYCLOAK_USER_PASSWORD: ${CADUCEUS_KEYCLOAK_USER_PASSWORD:-}  # ${...} in the realm file reads it
      KC_HOSTNAME: http://localhost:8080   # the address the browser uses, so the issuer every token names
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak/mesaverde-realm.json:/opt/keycloak/data/import/mesaverde-realm.json:ro
    ports:
      - "127.0.0.1:8080:8080"   # the browser signs in here; this machine only
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [login, auth]     # login: for the published port; auth: internal, the API fetches signing keys
    healthcheck:
      # Readiness, on the management port, with bash alone: the image has no curl.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q UP <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # The same image the demo runs beside the API (infra/model): llama.cpp and Qwen2.5-1.5B, weights baked in at build
  # time, served offline. The build downloads the source and weights; the running container has no route out.
  model:
    profiles: [llm]
    build: infra/model
    image: caduceus-model:local
    environment:
      LLAMA_ARG_HOST: 0.0.0.0   # on the internal model network only; nothing publishes its port
    networks: [model]           # internal only: no egress, no published port
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # No health check: the image holds no HTTP client to run one with, on purpose. The API does not wait for it;
    # until it answers, the clinician's summary comes from the record's facts.

networks:
  edge: {}
  model:
    internal: true
  data:
    internal: true
  login: {}                     # Keycloak's published port: publishing one needs a network with a way out
  auth:
    internal: true

volumes:
  pgdata: {}
