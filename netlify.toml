# The public demo's front end. Netlify serves the built UI and proxies /api/* to the API on Cloud Run, signing
# every proxied request so the API can refuse anything that did not come through this site.
#
# Set in Netlify (Site configuration > Environment variables), see docs/demo-deployment.md:
#   CADUCEUS_API_ORIGIN         the Cloud Run service URL, written into the proxy rule at build time
#   CADUCEUS_PROXY_SIGNING_KEY  the key Cloud Run also holds; its scopes must include Runtime

[build]
  base = "ui"
  command = "bash ../scripts/netlify_build.sh"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # This site is the demo, whose sign-in is the roster: the page can offer it while the API is still starting.
  VITE_ROSTER_SIGN_IN = "1"

# The API. The placeholder host is on the reserved .invalid domain, so if the build ever failed to replace it,
# requests would fail rather than go anywhere unexpected. A request that did not come from one of the demo's pages
# never gets this far: ui/netlify/edge-functions/pages-only.js answers it first.
[[redirects]]
  from = "/api/*"
  to = "https://CADUCEUS-API-ORIGIN.invalid/api/:splat"
  status = 200
  force = true
  signed = "CADUCEUS_PROXY_SIGNING_KEY"
  # Netlify's own limit for one address, five times the pace of the API's 300 requests in five minutes: a visitor
  # who overdoes it hears from the API, in its words, and a flood gets Netlify's 429 without reaching the API.
  [redirects.rate_limit]
    window_limit = 300
    window_size = 60
    aggregate_by = ["ip", "domain"]

# Everything else is the single-page app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The same headers the API sends with its own pages.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Vite fingerprints asset file names, so they can be cached for good.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
