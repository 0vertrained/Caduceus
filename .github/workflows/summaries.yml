name: summaries

# Reads the in-network model's chart summaries against the record: the published model image on this runner's
# loopback address, a summary for every case with a documented criterion, and the check on each sentence
# (src/caduceus/evals/summaries.py). A measurement, not a gate: the report is an artifact and the run's summary.
on:
  workflow_dispatch:
    inputs:
      sets:
        description: Cases to summarize (dataset, dev, heldout)
        default: dataset,dev
  push:
    branches: [main]
    paths:
      - src/caduceus/drafting.py
      - src/caduceus/grounding.py
      - src/caduceus/evals/summaries.py
      - infra/model/**
      - .github/workflows/summaries.yml

permissions:
  contents: read

concurrency:
  group: summaries
  cancel-in-progress: true

jobs:
  read:
    name: Summarize every case with the in-network model and check each sentence
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write  # to pull the published model image with short-lived Google credentials
    env:
      PROJECT: project-fc4eda29-999d-4812-a00
      REGION: us-central1
      WORKLOAD_IDENTITY_PROVIDER: projects/612996341673/locations/global/workloadIdentityPools/github/providers/caduceus
      DEPLOY_SA: caduceus-deployer@project-fc4eda29-999d-4812-a00.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - name: Start the in-network model, reachable only from this machine
        run: |
          image="${REGION}-docker.pkg.dev/${PROJECT}/caduceus/model:current"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker pull "$image"
          docker run -d --name model -p 127.0.0.1:8081:8081 -e LLAMA_ARG_HOST=0.0.0.0 "$image"
          for _ in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8081/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8081/health || { docker logs model 2>&1 | tail -n 30; exit 1; }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      - name: Summarize and check
        env:
          CADUCEUS_IN_VPC_URL: http://127.0.0.1:8081/v1
          CADUCEUS_IN_VPC_MODEL: qwen2.5-1.5b-instruct
          SETS: ${{ inputs.sets || 'dataset,dev' }}
        run: |
          mkdir -p "$RUNNER_TEMP/summaries"
          python -m caduceus.evals.summaries --sets "$SETS" --report "$RUNNER_TEMP/summaries/report.json"
          jq -r '.totals | "| Summaries | Sentences | Kept | Replaced, by reason | Fell back | Seconds each |",
            "|---|---|---|---|---|---|",
            "| \(.summaries) | \(.sentences) | \(.kept) (\(.kept_share * 100 | round)%) | \(.replaced | tostring) | \(.fallbacks | tostring) | \(.seconds_per_summary) |"' \
            "$RUNNER_TEMP/summaries/report.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Model log, for the record
        if: always()
        run: docker logs model 2>&1 | tail -n 20
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: summaries
          path: ${{ runner.temp }}/summaries
          if-no-files-found: warn
