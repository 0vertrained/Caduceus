name: model-bakeoff

# Runs every candidate draft model on the same de-identified requests (evals/bakeoff/requests.json) and scores the
# replies; see scripts/bakeoff.py. It uses the demo's Ollama Cloud key from Secret Manager, so it runs on main, the
# only ref Google's federation trusts. It runs when the requests or this workflow change, or by hand.
on:
  push:
    branches: [main]
    paths: ["evals/bakeoff/requests.json", "scripts/bakeoff.py", ".github/workflows/model-bakeoff.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-bakeoff
  cancel-in-progress: true

jobs:
  run:
    name: Run the bake-off
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: project-fc4eda29-999d-4812-a00
      WORKLOAD_IDENTITY_PROVIDER: projects/612996341673/locations/global/workloadIdentityPools/github/providers/caduceus
      DEPLOY_SA: caduceus-deployer@project-fc4eda29-999d-4812-a00.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Run every model on the same requests
        run: |
          key="$(gcloud secrets versions access latest --secret caduceus-model-api-key --project "$PROJECT")"
          echo "::add-mask::$key"
          python -m venv /tmp/b && /tmp/b/bin/pip install -q .
          OLLAMA_API_KEY="$key" PYTHONPATH=. /tmp/b/bin/python scripts/bakeoff.py run evals/bakeoff/requests.json bakeoff
          echo "::notice title=Bake-off::$(head -1 bakeoff/summary.md)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bakeoff
          path: bakeoff/
          retention-days: 7

  publish:
    # Only this job can write to the repository, and it runs nothing but a download and a push.
    name: Publish the results
    needs: run
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bakeoff
          path: bakeoff
      - name: Push to the bakeoff-results branch
        env:
          TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git init -q -b bakeoff-results published && cd published || exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp ../bakeoff/* .
          git add .
          git commit -qm "Bake-off results for ${GITHUB_SHA:0:7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git" bakeoff-results
