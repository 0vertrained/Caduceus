name: deploy-demo

# Deploys the public demo's API to Cloud Run once CI has passed on main. Netlify serves the UI and proxies /api
# to this service (netlify.toml). The Google Cloud project was prepared by infra/demo/setup-gcp.sh; see
# docs/demo-deployment.md.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  cloud-run:
    name: Deploy the demo API to Cloud Run
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    outputs:
      recorded: ${{ steps.record.outputs.recorded }}
    permissions:
      contents: read
      id-token: write  # GitHub's OIDC token, exchanged for short-lived Google credentials; no stored key
    env:
      # The demo's Google Cloud project, as infra/demo/setup-gcp.sh printed it. None of this is secret: Google
      # accepts GitHub's token only from this repository (by its immutable id) running on main.
      PROJECT: project-fc4eda29-999d-4812-a00
      REGION: us-central1
      WORKLOAD_IDENTITY_PROVIDER: projects/612996341673/locations/global/workloadIdentityPools/github/providers/caduceus
      DEPLOY_SA: caduceus-deployer@project-fc4eda29-999d-4812-a00.iam.gserviceaccount.com
      RUNTIME_SA: caduceus-demo-runtime@project-fc4eda29-999d-4812-a00.iam.gserviceaccount.com
      SERVICE: caduceus-demo
      # The Netlify site's address. An EHR launch (docs/smart-launch.md) may send the browser back only to its
      # /smart/callback: the API takes that address from here, never from a request.
      SITE: https://caduceusdemo.netlify.app
      # The draft model, on Ollama Cloud: fixed limits, so its key (in Secret Manager) cannot run up a bill. The deploy
      # uses the first of these, strongest writer first, that the key is offered, by exact name or family ("kimi-k2.6"
      # matches "kimi-k2.6:1t").
      MODEL_SECRET: caduceus-model-api-key
      MODEL_PREFERENCE: kimi-k2.6 deepseek-v3.2 glm-5 mistral-large-3 qwen3.5 deepseek-v3.1 gpt-oss:120b
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Record the draft model's replies into the image
        id: record
        # Without a key the demo still runs: drafts come from the template, and the case page says so.
        run: |
          if ! key="$(gcloud secrets versions access latest --secret "$MODEL_SECRET" --project "$PROJECT" 2>/dev/null)" \
              || [ -z "$key" ]; then
            echo "::notice title=Draft model::No key in Secret Manager ($MODEL_SECRET); drafts use the template."
            exit 0
          fi
          echo "::add-mask::$key"
          models="$(curl -fsS -H "Authorization: Bearer $key" https://ollama.com/api/tags | jq -r '.models[].name')" || models=""
          EXTERNAL_MODEL=""
          for want in $MODEL_PREFERENCE; do
            EXTERNAL_MODEL="$(grep -xF "$want" <<< "$models" || grep -F "$want:" <<< "$models" | grep "^$want:" || true)"
            EXTERNAL_MODEL="$(head -1 <<< "$EXTERNAL_MODEL")"
            [ -n "$EXTERNAL_MODEL" ] && break
          done
          if [ -z "$EXTERNAL_MODEL" ]; then
            echo "::warning title=Draft model::None of $MODEL_PREFERENCE is offered. Offered: $(tr "\n" " " <<< "$models")"
            exit 0
          fi
          echo "EXTERNAL_MODEL=$EXTERNAL_MODEL" >> "$GITHUB_ENV"
          echo "::notice title=Draft model::Using $EXTERNAL_MODEL"
          python -m venv /tmp/rec && /tmp/rec/bin/pip install -q .
          if CADUCEUS_EXTERNAL_PROVIDER=ollama CADUCEUS_EXTERNAL_MODEL="$EXTERNAL_MODEL" CADUCEUS_EXTERNAL_API_KEY="$key" \
              CADUCEUS_EXTERNAL_TIMEOUT=300 /tmp/rec/bin/python scripts/record_completions.py \
              data/recorded/completions.json 2> /tmp/record.err; then
            echo "::notice title=Draft model::Recorded $(jq length data/recorded/completions.json) replies from $EXTERNAL_MODEL"
            if [ -s /tmp/record.err ]; then echo "::warning title=Draft model::$(tail -c 600 /tmp/record.err | tr '\n' ' ')"; fi
            echo "recorded=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Draft model::Recording failed: $(tail -c 600 /tmp/record.err | tr '\n' ' ')"
          fi
          echo "MODEL_KEY=1" >> "$GITHUB_ENV"
      - name: Keep the recorded replies (de-identified text only)
        if: steps.record.outputs.recorded == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-recordings
          path: data/recorded/completions.json
          retention-days: 7
      - name: Build and push the image
        run: |
          image="${REGION}-docker.pkg.dev/${PROJECT}/caduceus/api:${COMMIT}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$image" .
          docker push "$image"
          echo "IMAGE=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")" >> "$GITHUB_ENV"
      - name: Find the in-network model's image
        # Published by model-image.yml. Without one, the API runs alone and summaries come from the record's facts.
        run: |
          image="${REGION}-docker.pkg.dev/${PROJECT}/caduceus/model"
          digest="$(gcloud artifacts docker images describe "$image:current" --format 'value(image_summary.digest)' 2>/dev/null || true)"
          if [ -n "$digest" ]; then
            echo "MODEL_IMAGE=$image@$digest" >> "$GITHUB_ENV"
          else
            echo "::notice title=In-network model::No model image is published yet (model-image.yml); the API runs alone."
          fi
      - name: Deploy
        # One instance at most, since the demo keeps its cases in memory, and none when idle. The payer takes 30
        # seconds so a visitor sees a request under review. With the model, two containers share the instance: only
        # the API's takes traffic, the model listens on 127.0.0.1, and CPU stays on so a summary can finish after its
        # request returns. That revision is written out whole, because gcloud's per-container flags would merge with
        # the containers already there.
        run: |
          secrets="CADUCEUS_PROXY_SIGNING_KEY=caduceus-proxy-signing-key:latest"
          if [ "${MODEL_KEY:-}" = 1 ]; then secrets="$secrets,CADUCEUS_EXTERNAL_API_KEY=$MODEL_SECRET:latest"; fi
          env="CADUCEUS_AUTH_MODE=demo,CADUCEUS_DEMO_RESET_HOURS=6,CADUCEUS_SHOWCASE=1,CADUCEUS_PAYER_REVIEW_SECONDS=30,CADUCEUS_EXTERNAL_PROVIDER=ollama,CADUCEUS_EXTERNAL_MODEL=$EXTERNAL_MODEL,CADUCEUS_EXTERNAL_TIMEOUT=20,CADUCEUS_SMART_REDIRECT_URIS=$SITE/smart/callback"
          common=(--project "$PROJECT" --region "$REGION" --service-account "$RUNTIME_SA" --concurrency 40
                  --min-instances 0 --max-instances 1 --allow-unauthenticated --quiet)
          containers() {
            gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" \
              --format 'value(spec.template.spec.containers[].name)' 2>/dev/null | tr ';,' '\n\n' || true
          }
          # The API alone. Flags without --container apply only to the container that takes traffic, so an earlier
          # revision's model container is removed explicitly.
          alone() {
            model="$(containers | grep -x model || true)"
            gcloud run deploy "$SERVICE" "${common[@]}" ${model:+--remove-containers model} --cpu-throttling \
              --image "$IMAGE" --port 8000 --cpu 1 --memory 1Gi --set-env-vars "$env" --set-secrets "$secrets"
          }
          if [ -z "${MODEL_IMAGE:-}" ]; then alone; exit 0; fi
          # What runs now, for the record if this fails.
          echo "Containers now: $(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" \
            --format json 2>/dev/null | jq -c '[.spec.template.spec.containers[] | {name, ports}]' || true)"
          # Settings as NAME=value lists, as the flags take them; a secret's value is SECRET:VERSION.
          jq -n --arg service "$SERVICE" --arg account "$RUNTIME_SA" --arg api "$IMAGE" --arg model "$MODEL_IMAGE" \
                --arg env "$env,CADUCEUS_IN_VPC_URL=http://127.0.0.1:8081/v1,CADUCEUS_IN_VPC_MODEL=qwen2.5-1.5b-instruct,CADUCEUS_IN_VPC_DRAFTS=0" \
                --arg secrets "$secrets" '
            def pairs: split(",") | map(split("=") | {name: .[0], value: (.[1:] | join("="))});
            def secret: {name, valueFrom: {secretKeyRef: {name: (.value | split(":")[0]), key: (.value | split(":")[1])}}};
            {apiVersion: "serving.knative.dev/v1", kind: "Service", metadata: {name: $service},
             spec: {template: {
               metadata: {annotations: {
                 "autoscaling.knative.dev/minScale": "0", "autoscaling.knative.dev/maxScale": "1",
                 "run.googleapis.com/execution-environment": "gen2", "run.googleapis.com/cpu-throttling": "false",
                 "run.googleapis.com/startup-cpu-boost": "true"}},
               spec: {containerConcurrency: 40, serviceAccountName: $account, containers: [
                 {name: "api", image: $api, ports: [{name: "http1", containerPort: 8000}],
                  env: (($env | pairs) + ($secrets | pairs | map(secret))),
                  resources: {limits: {cpu: "1", memory: "1Gi"}}},
                 {name: "model", image: $model, resources: {limits: {cpu: "2", memory: "3Gi"}}}]}}}}' \
            > "$RUNNER_TEMP/service.yaml"
          if gcloud run services replace "$RUNNER_TEMP/service.yaml" --project "$PROJECT" --region "$REGION" --quiet; then
            echo "::notice title=In-network model::Running $MODEL_IMAGE beside the API"
            exit 0
          fi
          echo "::warning title=In-network model::Deploying with the model failed; deploying the API alone instead."
          alone
      - name: The API is up, and refuses requests that did not come through Netlify
        run: |
          url="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format 'value(status.url)')"
          for _ in $(seq 1 20); do curl -fsS "$url/api/health" && break; sleep 3; done
          code="$(curl -s -o /dev/null -w '%{http_code}' "$url/api/demo")"
          if [ "$code" != 403 ]; then
            echo "::error title=Demo API::Expected 403 for an unsigned request, got $code"; exit 1
          fi
          echo "::notice title=Demo API::Deployed ${COMMIT:0:7} to $url; unsigned requests are refused"

  recordings:
    # Publishes what the model saw and said (de-identified text only) to the model-recordings branch for review. A
    # separate job, so the token that can write to the repository never runs beside installed packages.
    name: Publish the recorded model replies
    needs: cloud-run
    if: needs.cloud-run.outputs.recorded == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: model-recordings
          path: recorded
      - name: Push to the model-recordings branch
        env:
          TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          git init -q -b model-recordings published && cd published || exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp ../recorded/completions.json .
          git add completions.json
          git commit -qm "Model replies recorded by the deploy of ${COMMIT:0:7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git" model-recordings
