name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"
  PLAYWRIGHT_VERSION: "1.63.0"
  PIP_AUDIT_VERSION: "2.10.1"
  GRYPE_VERSION: "0.120.1"
  GRYPE_SHA256: "0a9ee97ef5ae2ee953b0a80098105052e846cdbe319a57d808b519c33cd1343d"
  GRYPE_CHECK_FOR_APP_UPDATE: "false"

jobs:
  python:
    name: Lint, tests and eval gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check src tests scripts
      - name: Unit and API tests (includes the rule that nothing outside the router talks to a model)
        run: pytest
      - name: Eval gate (criteria agreement, PHI leakage, red team)
        run: python -m caduceus.evals.run
      - name: Keep the eval report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-report
          path: evals/reports/latest.json

  dependencies:
    name: Known vulnerabilities in Python and npm packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Python packages, as CI resolves them today (the auditor lives in its own environment)
        run: |
          pip install -e '.[dev]'
          pip freeze --exclude-editable > "$RUNNER_TEMP/requirements.txt"
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/pip" install "pip-audit==${PIP_AUDIT_VERSION}"
          "$RUNNER_TEMP/audit/bin/pip-audit" -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --progress-spinner off
      - name: UI packages, including build and test tools
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=low
      - name: Playwright, at the version the end-to-end job installs
        run: |
          mkdir -p "$RUNNER_TEMP/playwright" && cd "$RUNNER_TEMP/playwright"
          npm init -y > /dev/null
          npm install --package-lock-only --no-audit --no-fund "playwright@${PLAYWRIGHT_VERSION}"
          npm audit --audit-level=low

  ui:
    name: UI type check and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error

  e2e:
    name: End-to-end walk with accessibility checks
    needs: [python, ui]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: pip install -e .
      - run: npm ci --no-audit --no-fund
        working-directory: ui
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: ui/dist
      - name: Install Playwright and Chromium
        run: |
          npm install --global "playwright@${PLAYWRIGHT_VERSION}"
          npx --yes "playwright@${PLAYWRIGHT_VERSION}" install --with-deps chromium
      - name: Walk the screens (axe-core, WCAG 2.2 AA tags; reflow at 320 px)
        run: NODE_PATH="$(npm root --global)" scripts/e2e.sh ui/test-results
      - name: Keep screenshots and the accessibility report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: ui/test-results

  image:
    name: Container image builds and serves
    needs: [ui]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t caduceus-api:ci .
      - name: Record the base images this build used
        run: |
          awk '/^FROM/ {print $2}' Dockerfile | sort -u | while read -r ref; do
            docker pull -q "$ref" > /dev/null
            echo "::notice title=Base image::$ref resolved to $(docker image inspect --format '{{index .RepoDigests 0}}' "$ref")"
          done
      - name: Install Grype (pinned release, checksum verified)
        run: scripts/install_grype.sh
      - name: Known vulnerabilities in the image (fails on any with a released fix)
        run: |
          grype docker:caduceus-api:ci -o json --file grype-image.json
          python3 scripts/vuln_report.py grype-image.json --label "Container image" --fail-on fixed
      - name: Smoke test
        if: ${{ !cancelled() }}
        run: |
          docker run -d --name api -p 127.0.0.1:8000:8000 --read-only --tmpfs /tmp \
            -v caduceus-state:/var/lib/caduceus -e CADUCEUS_AUTH_MODE=dev \
            -e CADUCEUS_DEID_KEY="ci-only-signing-key-at-least-32-bytes-long" \
            caduceus-api:ci sh -c "python -m caduceus.seed --if-missing && exec uvicorn caduceus.api:create_app --factory --host 0.0.0.0 --port 8000"
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 1; done
          curl -fsS -H "X-Caduceus-User: dolores" http://127.0.0.1:8000/api/queue | python3 -c "import json,sys; q=json.load(sys.stdin); assert sum(len(g['cases']) for g in q['groups']) > 0"
          curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="root">'
      - name: Refuses to start without a de-identification key outside development
        if: ${{ !cancelled() }}
        run: |
          if docker run --rm caduceus-api:ci python -c "from caduceus.app_factory import build_services; build_services()" > refusal.log 2>&1; then
            echo "expected the default (OIDC) configuration to refuse to start without CADUCEUS_DEID_KEY"; exit 1
          fi
          grep -q "InsecureConfiguration: Set CADUCEUS_DEID_KEY" refusal.log || { cat refusal.log; exit 1; }
      - name: Show the container log on the run page when the image job fails
        if: failure()
        run: |
          { docker logs api 2>&1 || true; cat refusal.log 2>/dev/null || true; } | tail -n 40 | python3 -c "import sys; t = sys.stdin.read().replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'); print('::error title=API container log (last 40 lines)::' + t)"
      - if: always()
        run: docker logs api || true
      - name: Keep the image scan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grype-image
          path: grype-image.json

  infra:
    name: Terraform format, validate and policy scan
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Checkov (every skip carries its reason in the code)
        run: |
          pip install checkov
          checkov -d . --framework terraform --quiet --compact
      - name: Compose file is valid
        working-directory: .
        run: CADUCEUS_DEID_KEY=ci-only-placeholder docker compose config --quiet

  dataset:
    name: Synthea builds from source; dataset regenerates byte-identically
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e .
      - name: Build Synthea from source with its libraries upgraded
        run: |
          make synthea
          echo "::notice title=Synthea build::$(tail -n 1 .synthea/synthea-build.log 2>/dev/null | cut -c1-200); jar sha256 $(sha256sum .synthea/synthea.jar | cut -d' ' -f1)"
      - name: Regenerate the dataset (Synthea runs with the network switched off)
        run: make data PY=python
      - name: No byte changed
        run: git diff --exit-code --stat -- data/
      - name: Install Grype (pinned release, checksum verified)
        if: ${{ !cancelled() }}
        run: scripts/install_grype.sh
      - name: Known vulnerabilities in the Synthea build (fails on any with a released fix)
        if: ${{ !cancelled() }}
        run: |
          grype file:.synthea/synthea.jar -o json --file grype-synthea.json
          python3 scripts/vuln_report.py grype-synthea.json --label "Synthea (built from source, patched)" --fail-on fixed
      - name: Keep the Synthea scan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grype-synthea
          path: grype-synthea.json
