[project]
name = "caduceus"
version = "0.1.0"
description = "PHI-aware prior-authorization agent for a simulated health system (portfolio project)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.162,<1",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.14.1,<3",
  "pyyaml>=6.0.3",
  "httpx>=0.28.1",
  "opentelemetry-api>=1.45.1",
  "opentelemetry-sdk>=1.45.1",
  "mcp>=2.3",
  "pyjwt[crypto]>=2.15.1",
  "tzdata>=2026.6",  # the IANA zone database, so clinic time works on minimal images that ship none
  # Postgres, for a deployment (CADUCEUS_DATABASE_URL). The binary build brings its own libpq, so the Wolfi image
  # needs no system package; Dependabot proposes its releases with the rest.
  "psycopg[binary]>=3.3.6,<4",
  "psycopg-pool>=3.3.3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=9.2", "ruff>=0.17.2"]

[project.scripts]
caduceus-seed = "caduceus.seed:main"
caduceus-evals = "caduceus.evals.run:main"

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"caduceus.migrations" = ["*.sql"]  # applied at startup, so they ship with the package

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"src/caduceus/api.py" = ["B008"]  # FastAPI's Depends() in defaults is the framework's intended pattern
"tests/**" = ["S105", "S106"]     # test-only fake credentials
